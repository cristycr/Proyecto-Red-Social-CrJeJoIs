<div class="header-search" #userSearchContainer>
  <input
    type="text"
    class="header-search-input"
    placeholder="Buscar usuarios..."
    aria-label="Buscar usuarios"
    autocomplete="off"
    [value]="searchQuery()"
    (input)="onSearchInput($event)"
    (focus)="onSearchFocus()"
    (keydown.escape)="closeSearch()"
  />

  @if (showSearchDropdown()) {
    <div class="header-search-dropdown">
      @if (usersLoading()) {
        <p class="header-search-state">Cargando usuarios...</p>
      } @else if (usersLoadError()) {
        <div class="header-search-error-wrap">
          <p class="header-search-state header-search-state-error">{{ usersLoadError() }}</p>
          <button class="header-search-retry" type="button" (click)="retryUsersSearchLoad()">
            Reintentar
          </button>
        </div>
      } @else if (filteredUsers().length === 0) {
        <p class="header-search-state">No hay usuarios con ese nombre.</p>
      } @else {
        @for (user of filteredUsers(); track user.id) {
          <a class="header-search-result" [routerLink]="['/profile', user.id]" (click)="onUserResultClick()">
            <img
              class="header-search-avatar"
              [src]="buildAvatarUrl(user.avatarPath)"
              [alt]="'Avatar de ' + user.nickname"
            />
            <span>{{ user.nickname }}</span>
          </a>
        }
      }
    </div>
  }
</div>
