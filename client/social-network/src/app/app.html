<app-site-header />

<div class="toast-container" aria-live="polite" aria-atomic="true">
  @for (toast of toasts(); track toast.id) {
    <article
      class="toast"
      [class.toast-success]="toast.type === 'success'"
      [class.toast-error]="toast.type === 'error'"
      [class.toast-info]="toast.type === 'info'"
      role="status"
    >
      @if (toast.avatar) {
        <img [src]="'https://localhost:7185' + toast.avatar" class="toast-avatar" alt="Avatar" />
      }
      <span>{{ toast.message }}</span>
      <button
        type="button"
        class="toast-close"
        aria-label="Cerrar notificacion"
        (click)="dismissToast(toast.id)"
      >
        x
      </button>
    </article>
  }
</div>

<main>
  <router-outlet></router-outlet>
</main>

<footer>
  <div class="footer-content">
    <div class="footer-logo">
      <a routerLink="/landing">TechIt!</a>
    </div>
    <div class="footer-social">
      <a href="https://github.com/cristycr/Proyecto-Red-Social-CrJeJoIs" title="GitHub" aria-label="GitHub"><img
          src="assets/icons/github.svg" alt="GitHub" height="24"></a>
    </div>
  </div>
  <div class="footer-bottom">TechIt© 2026</div>

</footer>
