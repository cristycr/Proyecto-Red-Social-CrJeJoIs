<div class="big-container">
    <form action="">
        <div class="container">
            <div class="container-header">
                <h1>¡Hola de nuevo!</h1>
                <span>¡Nos alegramos mucho de volver a verte!</span>
            </div>
            <div class="div-form">
                <div class="div-input">
                    <span>Correo electrónico o usuario <span class="required">*</span></span>
                    <input type="text" id="input-email">
                </div>
                <div class="div-input">
                    <span>Contraseña <span class="required">*</span></span>
                    <input type="password" id="input-password">
                    <div class="div-checkbox">
                        <input type="checkbox" id="keep-logged-checkbox"><span class="small-text">Mantener la sesión iniciada</span>
                    </div>
                </div>
                <div class="div-input">
                    <input class="btn" type="submit" value="Iniciar sesión">
                    <span class="small-text">¿No tienes cuenta? <a routerLink="/register">Registrarse</a></span>
                </div>
            </div>
        </div>
    </form>
</div>
