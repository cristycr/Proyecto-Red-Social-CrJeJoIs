<div class="container">
	@if (loading()) {
		<p>Cargando perfil...</p>
	} @else {
		@if (errorMessage()) {
			<p>{{ errorMessage() }}</p>
		}

		<div class="profile-header">
			<img [src]="profileImage()" alt="Avatar" class="avatar">
			<span class="nickname">{{ nickname() }}</span>
		</div>

		<div class="biography">
			@if (biography()) {
				<p>{{ biography() }}</p>
			}
		</div>

		<div class="profile-stats">
			<div class="stat">
				<span class="stat-number">{{ followers() }}</span>
				<span class="stat-label">Seguidores</span>
			</div>
			<div class="stat">
				<span class="stat-number">{{ followeds() }}</span>
				<span class="stat-label">Seguidos</span>
			</div>
		</div>

		@if (isOwnProfile()) {
			<button class="logout" (click)="logout()">Cerrar sesión</button>
			<div class="avatar-actions">
					<input type="file" id="avatarInput" (change)="onAvatarSelected($event)" hidden />
					<button (click)="triggerAvatarInput()">Cambiar avatar</button>
					<button (click)="removeAvatar()">Eliminar avatar</button>
			</div>
		}
	}
	<!--TODO: Mostrar las publicaciones del usuario-->
</div>

<app-create-post-btn />
