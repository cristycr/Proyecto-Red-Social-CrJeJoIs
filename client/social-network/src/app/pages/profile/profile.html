<div class="container">
	<div class="profile-header">
		<img src="/assets/images/avatar-default.png" alt="Avatar" class="avatar">
        <div class="biografy">
            <span class="nickname">Nickname</span>
            <p>Aquí puedes añadir una pequeña biografía para que la gente sepa sobre ti y te conozca. ¡Habla sobre tus gustos y lo que disfrutas hacer!</p>
        </div>
	</div>
	<div class="profile-stats">
		<div class="stat">
			<span class="stat-number">123</span>
			<span class="stat-label">Seguidores</span>
		</div>
		<div class="stat">
			<span class="stat-number">456</span>
			<span class="stat-label">Seguidos</span>
		</div>
	</div>
    <!--Mostrar las publicaciones del usuario-->
	<button class="logout" (click)="logout()">Cerrar sesión</button>
</div>
